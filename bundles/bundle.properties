block.emelia-04-04-wall-blaster.name = Wall Blaster
block.emelia-04-04-wall-blaster.description = Mines ores in walls. Requires larger amounts of power. Can be boosted with [#ffffff]nitrogen.
block.emelia-04-05b-wall-crusher.name = Wall Crusher
