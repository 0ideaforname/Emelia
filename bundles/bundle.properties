item.emelia-01-07-erbidium.name = Erbidium
item.emelia-01-07-erbidium.description = Extremely tough metal used in advanced structures, units and radiation shielding.
item.emelia-01-07c-obsidian.name = Obsidian
item.emelia-01-07c-obsidian.description = Extremely sharp material. Used in advanced drill and cutting technology.
item.emelia-01-08c-detonite.name = Detonite
item.emelia-01-08c-detonite.description = Highly explosive yet strong alloy. Used in powerful bombs, landmines, and strong ammunition.
item.emelia-01-08-thranil.name = Thranil
item.emelia-01-08-thranil.description = Forcibly displaced chunk of thranil flesh.
item.emelia-01-08-thranil.details = Its inedible and unsafe for living organisms due to violent combustive, discharging, and radioactive properties.
item.emelia-01-09-nano-alloy.name = Nano Alloy
item.emelia-01-09-nano-alloy.description = Advanced conductive alloy used in all types of advanced structures.
item.emelia-01-10-thanite.name = Thanite
item.emelia-01-10-thanite.description = Vastly stabilized [accent]Vantorium.[] Used in regen blocks, shield systems, and blocking electricity.
item.emelia-01-11-vonitte.name = Vonitte
item.emelia-01-11-vonitte.description = Used as nuclear fuel and depletion. Capable of stabilizing Vantorium.
item.emelia-01-12-aerigium.name = Aerigium
item.emelia-01-12-aerigium.description = Used in extremely durable turrets, advanced units, and ammo.
item.emelia-01-13-vantorium.name = Vantorium
item.emelia-01-13-vantorium.description = Ancient, unstable metal. Holds reality-bending capabilities if utilised properly.
item.emelia-01-13-vantorium.details = Fragments of degraded inscriptions are embedded within the material, suggesting prior use or an origin.\nContains multiple traces of known materials, such as Phase Fabric, Osmium, Antimatter, and Fluoroantimonic Acid.

