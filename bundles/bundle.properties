# Units
unit.emelia-08-01-01-splinter.name = Splinter
unit.emelia-08-01-01-splinter.description = Fires small, shield-piercing lasers at enemy targets.
unit.emelia-08-01-02-fracture.name = Fracture
unit.emelia-08-01-02-fracture.description = Fires salvos of charged bullets at enemy targets.
unit.emelia-08-01-03-rupture.name = Rupture
unit.emelia-08-01-03-rupture.description = Fires piercing, railgun-charged cluster shells at enemy targets. Less affected by harmful terrain.
unit.emelia-08-01-04-collapse.name = Collapse
unit.emelia-08-01-04-collapse.description = Fires a barrage of homing laser charges at enemy targets. Destroys non-laser enemy projectiles with under-turret PD weapons. Vastly unaffected by harmful terrain.
unit.emelia-08-01-05-oblivion.name = Oblivion
unit.emelia-08-01-05-oblivion.description = Fires massive charged fragging shells at enemy targets. Vastly unaffected by harmful terrain.

#Enclosure
sector.emelia-01-enclosure.name = Enclosure
sector.emelia-01-enclosure.description = The conquest of [#bf92f9]Emelia []begins here. Work with what is avaible. Research initial technology. Establish a foothold.

Desolate region of the planet, this lands to be the ideal sector to start and learn the basics and technology.

enclosure.drill = [#bf92f9]Landing successful.\n\nWelcome to [accent]Emelia[#bf92f9], the infamous crystalline planet.\nYour first task is [accent]:production: item production.\n\n[#bf92f9]Start by researching the [accent]:production:Small Drill[#bf92f9].\nPlace [accent]Small Drills[#bf92f9] on [#656563]Lenite[#bf92f9] ore.
enclosure.track = [accent]Tracks[#bf92f9] are required deliver items from a block to a block.\nBuild multiple and move 100 [#656563]Lenite [#bf92f9]to the [accent]Core.
enclosure.turbine = [#bf92f9]Research and build [accent]Turbine Concentrators [#bf92f9]for [accent]:power:power.
enclosure.node = [#bf92f9]Research and build [accent]Liton Nodes[] to distribute :power:power between blocks.
enclosure.blaster = [accent]Wall Blasters[#bf92f9] are required to mine wall ores.\nResearch and build one, and connect :power:power to it.
enclosure.liton = [#bf92f9]Move 100 [#d8deff]Liton to the [accent]Core.
enclosure.scrap = [#bf92f9]Due to reactor meltdown, [#95acd8]Cryogenic Scrap[#bf92f9] deposits have scattered here.\nSet up drills to mine it, and refine it to [#c0ecff]Cryogen[#bf92f9] using [accent]Cryogenic Crusher.
enclosure.cryogen = [#bf92f9]Move 100 [#c0ecff]Cryogen[#bf92f9] to the [accent]Core.
enclosure.turret = [#bf92f9]Enemy forces have been detected.\nResearch and build 3 :turret:[accent]Needle turrets [#bf92f9]to defend.
enclosure.ammo = [#bf92f9]Supply the :turret:[accent]Needle[#bf92f9] turrets with [#656563]Lenite[#bf92f9] as ammo.\n[accent]You can manually deposit ammo.
enclosure.wall = :defense:[#bf92f9]Walls stop enemy fire before it reaches your buildings.\nResearch and build 12 :defense:[#c0ecff]Cryogen Walls[#bf92f9], protecting your buildings from damage.
enclosure.enemySpawn = [#bf92f9]This is the enemy drop zone.\n\n[#bf92f9]Anything built inside this will be instantly eradicated when a wave starts.\n\n[red]A wave will begin now.
enclosure.notice =[#bf92f9]Continue expanding your resource extraction, build more :turret:,\n\nand remember that [accent]a stronghold cannot be too strong.

#Carbon Canyon
sector.emelia-02-carbonCanyon.name = Carbon Canyon
sector.emelia-02-carbonCanyon.description = This sector contains large deposits of [accent]Graphite and Lenite[]. This lends to be the perfect sector to research and use [accent]Cerebrium.
carbonCanyon.cerebrium = [#656563]Cerebrium [#bf92f9]is vital for most electronics and advanced buildings.\n\nResearch and build the [accent]Cerebrium Arc Furnace.
carbonCanyon.obtain = [#bf92f9]Supply the furnace with [#a4b8fa]Graphite[#bf92f9] and [#656563]Lenite[#bf92f9].\n\nAlso you can supply turrets with it as [accent]advanced ammunition.
carbonCanyon.enemy = [#bf92f9]Expand the [#656563]Cerebrium [#bf92f9]production.\n\n[red]Be wary, enemy is now aware of you.
carbonCanyon.air = [#bf92f9]Warning: enemy air units approaching. Prepare aerial defense.
carbonCanyon.bossApproaching = [red]Warning: elite enemy ground tanks detected. Prepare a second layer of defense.

#Basalt Trench
sector.emelia-03-basaltTrench.name = Basalt Trench
sector.emelia-03-basaltTrench.description = An old [accent]Flicker production facility []lies here, abandoned yet [accent]functional[]. Deposits of [accent]Vitracite Sand []have accumulated due to geothermal activity. Smelt [accent]Reinforced Glass. Fabricate units. []Capture the facility.
basaltTrench.vitraciteSand = [#bf92f9]Geothermal activity has caused significant deposits of [accent]Sand\n[#bf92f9]here to become [accent]Vitracitic[#bf92f9].\n\nSet up [accent]Wall Crushers [#bf92f9]to mine it, and produce\n\n[accent]Reinforced Glass.
basaltTrench.units = :turret:[#bf92f9]Turrets are useless at assaulting. :unit:Units are required.\n\nBuild a [accent]Ship Fabricator [#bf92f9]and fulfill the requirements to build [accent]Flicker [#bf92f9]units.
basaltTrench.command = [accent]Command mode [#bf92f9]is required for ordering :unit:[accent]units.\n\nHold Left Shift [#bf92f9]and [accent]left click and drag across a selection or click [#bf92f9]on a unit to select them.\nRight click on a unit type to de-select them.\n[accent]Hold Left Shift and right click to order movement to a location.\n\nShift + G selects all units, Shift + H selects all factories.

#Vitric Bypass
sector.emelia-04-vitricBypass.name = Vitric Bypass
sector.emelia-04-vitricBypass.description = Moderate deposits of [accent]Tungsten[] are detected here. Additionally, most deposits are protected by the enemy Coreless outpost here.
vitricBypass.tungsten = [#bf92f9]Deposits of [accent]Tungsten [#bf92f9]are present here. Mine them via [accent]Pressure Drills.\nYou can use it as elite ammunition aswell.
vitricBypass.enemyProduction = [red]Enemy production has started.


