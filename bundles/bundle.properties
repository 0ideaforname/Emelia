item.emelia-01-03c-vitracite-sand.name = Vitracite Sand
item.emelia-01-03c-vitracite-sand.description = Extensively used in crafting.
item.emelia-01-04-liton-nitride.name = Liton Nitride
item.emelia-01-04-liton-nitride.description = Used in advanced batteries, advanced alloys, and discharge systems. Required in fabrication of advanced units.
item.emelia-01-04c-quartz.name = Quartz
item.emelia-01-04c-quartz.description = A white, crystallic and charged quartz. Used in units, repair systems and drills.
item.emelia-01-05-cerebrium.name = Cerebrium
