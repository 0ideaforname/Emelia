genesis.lunarBasalt = :power:Power structures require [accent]Lunar Basalt.[]\n Set up [accent]Miners[] to mine it aswell.
genesis.defend = Enemies are approaching.\nResearch and build :turret:[accent]Pebble turrets[],\nAlongside with [accent]Selite Walls[]\nProtecting them from damage.
genesis.supply = Supply turrets with ammo.

